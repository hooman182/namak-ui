<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نامک — مدیریت نامه</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('minimal__palette');
          if (!s || ['light','dark','ocean','forest'].indexOf(s) === -1) return;
          document.documentElement.setAttribute('data-color-scheme', s === 'dark' ? 'dark' : 'light');
          if (s === 'ocean' || s === 'forest') {
            var palettes = {"ocean":{"primary":{"lighter":"#C2F0F7","light":"#5FCFDD","main":"#0CA5B8","dark":"#067A8C","darker":"#034F5C","contrastText":"#FFFFFF"},"secondary":{"lighter":"#D4F0FE","light":"#72BBF5","main":"#1A8FE3","dark":"#0B65B0","darker":"#053D73","contrastText":"#FFFFFF"}},"forest":{"primary":{"lighter":"#D5F5E3","light":"#82D9A5","main":"#2DAF6E","dark":"#1B7F4F","darker":"#0E5535","contrastText":"#FFFFFF"},"secondary":{"lighter":"#E8F5E9","light":"#A5D6A7","main":"#66BB6A","dark":"#388E3C","darker":"#1B5E20","contrastText":"#FFFFFF"}}};
            var p = palettes[s];
            if (p) {
              var vars = ['lighter','light','main','dark','darker','contrastText'];
              var css = '';
              for (var i = 0; i < vars.length; i++) {
                var v = vars[i];
                var pv = p.primary[v];
                var sv = p.secondary[v];
                css += '--palette-primary-' + v + ':' + pv + ';';
                css += '--palette-secondary-' + v + ':' + sv + ';';
                var pr = parseInt(pv.slice(1,3),16), pg = parseInt(pv.slice(3,5),16), pb = parseInt(pv.slice(5,7),16);
                var sr = parseInt(sv.slice(1,3),16), sg = parseInt(sv.slice(3,5),16), sb = parseInt(sv.slice(5,7),16);
                css += '--palette-primary-' + v + 'Channel:' + pr + ' ' + pg + ' ' + pb + ';';
                css += '--palette-secondary-' + v + 'Channel:' + sr + ' ' + sg + ' ' + sb + ';';
              }
              var el = document.createElement('style');
              el.id = 'palette-overrides';
              el.textContent = ':root{' + css + '}';
              document.head.appendChild(el);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
