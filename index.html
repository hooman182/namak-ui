<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نامک — مدیریت نامه</title>
    <script>
      (function () {
        try {
          var scheme = localStorage.getItem('minimal__palette');
          if (['light', 'dark', 'ocean', 'forest'].includes(scheme)) {
            document.documentElement.setAttribute('data-color-scheme', scheme);
          }
        } catch (error) {
          console.warn('Unable to restore the saved color palette.', error);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
